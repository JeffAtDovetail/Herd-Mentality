<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Join the herd</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="phone">
      <div>
        <p class="eyebrow">Herd Mentality</p>
        <h1 id="heading">Join the herd</h1>
      </div>

      <form id="join-form" autocomplete="off">
        <label for="name">Your name</label>
        <input
          id="name"
          name="name"
          maxlength="24"
          placeholder="e.g. Sam"
          autocapitalize="words"
          enterkeyhint="go"
          required
        />
        <button type="submit" id="join-button">Join</button>
        <p class="status" id="status" role="status"></p>
      </form>

      <div class="card" id="joined" hidden>
        <p class="eyebrow">You're in</p>
        <p class="name" id="joined-name"></p>
        <p class="status">Look up at the big screen — the game will start soon.</p>
      </div>
      <button type="button" class="link-button" id="change-name" hidden>Change name</button>
    </main>

    <script src="/join.js" type="module"></script>
  </body>
</html>
