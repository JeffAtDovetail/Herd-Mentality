<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herd Mentality · LLM test</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="editor llm">
      <header class="editor-header">
        <div>
          <a class="back" id="back" href="/">← Back to host screen</a>
          <h1>LLM test</h1>
          <p class="status" id="meta">Each send is a fresh request to Bedrock with no history.</p>
        </div>
      </header>

      <form id="llm-form" class="llm-form" autocomplete="off">
        <label>
          Prompt
          <textarea id="prompt" rows="6" maxlength="8000" placeholder="Say hello" required></textarea>
        </label>

        <details>
          <summary>Options</summary>
          <div class="llm-options">
            <label>
              Model
              <select id="model"></select>
            </label>
            <label>
              System prompt
              <textarea id="system" rows="3" maxlength="4000" placeholder="Optional"></textarea>
            </label>
            <div class="settings-row">
              <label class="setting">
                Max tokens
                <input type="number" id="max-tokens" min="1" max="4096" value="1024" />
              </label>
              <label class="setting">
                Temperature
                <input type="number" id="temperature" min="0" max="1" step="0.1" placeholder="default" />
              </label>
            </div>
          </div>
        </details>

        <div class="llm-actions">
          <button type="submit" id="send">Send</button>
          <span class="status">⌘/Ctrl + Enter to send</span>
        </div>
      </form>

      <section class="llm-result" id="result" hidden aria-live="polite">
        <p class="eyebrow" id="result-meta"></p>
        <pre id="output"></pre>
      </section>
    </main>

    <script src="/llm.js" type="module"></script>
  </body>
</html>
